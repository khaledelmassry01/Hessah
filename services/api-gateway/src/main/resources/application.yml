server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${APP_SECURITY_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173,http://localhost:8082,http://127.0.0.1:8082,http://[::1]:8082,http://localhost:8080}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - X-Session-Id
            exposed-headers:
              - Authorization
              - X-Session-Id
            allow-credentials: true
            max-age: 3600
      routes:
        - id: core-backend
          uri: ${CORE_BACKEND_URL:http://core-backend:8081}
          predicates:
            - Path=/api/core/**
          filters:
            - StripPrefix=2
        - id: ai-engine
          uri: ${AI_ENGINE_URL:http://ai-engine:8000}
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
